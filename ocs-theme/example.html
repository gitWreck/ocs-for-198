<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCS Theme Example</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="ocs-theme.css" rel="stylesheet" />
  </head>
  <body class="ocs-app">
    <nav class="navbar navbar-expand-lg ocs-navbar shadow-sm">
      <div class="container-fluid px-4 px-xxl-5">
        <span class="navbar-brand">Project Portal</span>
        <button class="btn btn-sm ocs-btn-logout" type="button">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span class="ocs-btn-logout-label">Logout</span>
        </button>
      </div>
    </nav>

    <main class="container-fluid px-4 px-xxl-5 py-4 py-lg-5">
      <section class="card ocs-hero-card rounded-4 shadow-sm mb-4">
        <div class="card-body p-4 p-lg-5">
          <h1 class="h3 fw-bold mb-2">Internship Portal</h1>
          <p class="mb-0 opacity-75">
            A compact Bootstrap layout using the OCS theme.
          </p>
        </div>
      </section>

      <div class="row g-4">
        <div class="col-lg-4">
          <section class="card ocs-card">
            <div class="card-body p-4">
              <div class="ocs-section-title mb-1">Student Information</div>
              <div class="ocs-section-subtitle mb-4">Current account details</div>

              <div class="mb-3">
                <div class="ocs-info-label">Full Name</div>
                <div class="ocs-info-value">Juan Dela Cruz</div>
              </div>
              <div class="mb-3">
                <div class="ocs-info-label">Student Number</div>
                <div class="ocs-info-value">2026-00000</div>
              </div>

              <button class="btn ocs-btn-primary w-100">Save Changes</button>
            </div>
          </section>
        </div>

        <div class="col-lg-8">
          <section class="card ocs-card">
            <div class="card-body p-4">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div>
                  <div class="ocs-section-title mb-1">Checklist</div>
                  <div class="ocs-section-subtitle">Submission status</div>
                </div>
                <span class="ocs-pill">2 of 3 submitted</span>
              </div>

              <div class="ocs-checklist-grid mb-4">
                <div class="ocs-checklist-item is-submitted">
                  <div class="d-flex align-items-center gap-2">
                    <span class="ocs-check is-submitted"><i class="bi bi-check-lg"></i></span>
                    <div>
                      <div class="fw-bold">Application Form</div>
                      <div class="text-muted small">Submitted</div>
                    </div>
                  </div>
                </div>
                <div class="ocs-checklist-item is-pending">
                  <div class="d-flex align-items-center gap-2">
                    <span class="ocs-check is-pending">!</span>
                    <div>
                      <div class="fw-bold">Medical Certificate</div>
                      <div class="text-muted small">Pending</div>
                    </div>
                  </div>
                </div>
              </div>

              <button class="btn ocs-action-btn px-4">New Application</button>
              <button class="btn ocs-btn-secondary px-4 ms-2">View Details</button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
